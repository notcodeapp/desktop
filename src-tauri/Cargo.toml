[package]
name = "notcode-desktop"
version = "0.3.9"
description = "NotCode native desktop workspace"
edition = "2021"
rust-version = "1.90"

[lib]
name = "notcode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"
keyring = { version = "3", features = ["windows-native"] }
rfd = "0.15"
portable-pty = "0.8"
cap-std = "3"
axum = "0.8"
axum-server = { version = "0.9", features = ["tls-rustls-ring"] }
rcgen = "0.14"
base64 = "0.22"
if-addrs = "0.13"
tauri-plugin-fs = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
